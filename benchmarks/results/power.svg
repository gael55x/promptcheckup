<text class="mute" x="238.0" y="336.0" font-size="11" text-anchor="middle" font-weight="400">50</text>
<text class="mute" x="406.0" y="336.0" font-size="11" text-anchor="middle" font-weight="400">80</text>
<text class="mute" x="630.0" y="336.0" font-size="11" text-anchor="middle" font-weight="400">120</text>
