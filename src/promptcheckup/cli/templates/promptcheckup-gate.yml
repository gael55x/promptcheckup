name: Prompt checkup
on:
  pull_request:
    paths:
      - 'prompts/system.md'
      - 'prompts/tools.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Also install whatever your agent imports, e.g. pip install -r requirements.txt
      - run: python -m pip install git+https://github.com/gael55x/promptcheckup
      - name: Evaluate the prompt change
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
        run: promptcheckup gate --old-ref "origin/$BASE_REF" --yes --out report.md
      - name: Post the report
        if: ${{ always() && hashFiles('report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file report.md
