name: Weekly prompt checkup
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: promptcheckup-weekly
  cancel-in-progress: false

jobs:
  checkup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Keep these hashFiles paths in sync with [prompts].files.
      # A unique key saves each new snapshot; restore the latest for this prompt hash.
      - uses: actions/cache@v4
        with:
          path: .promptcheckup/snapshots
          key: promptcheckup-snapshots-${{ hashFiles('prompts/system.md', 'prompts/tools.md') }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Restore earlier prompts too, so a prompt change can still be checked for regressions.
          restore-keys: |
            promptcheckup-snapshots-${{ hashFiles('prompts/system.md', 'prompts/tools.md') }}-
            promptcheckup-snapshots-
      # Install your agent's dependencies and configure its LLM endpoint before enabling.
      - run: python -m pip install git+https://github.com/gael55x/promptcheckup
      - name: Run the weekly check-up
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}  # match [llm] api_key_env
        run: promptcheckup checkup --yes --out checkup.md --proposal-out proposal.md
      - name: Post to the check-up timeline
        if: ${{ hashFiles('checkup.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label=$(gh label list --search promptcheckup --json name --jq '.[] | select(.name == "promptcheckup") | .name')
          if [ -z "$label" ]; then
            gh label create promptcheckup --description 'Weekly prompt check-ups' --color 0E8A16
          fi
          issue=$(gh issue list --label promptcheckup --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            issue=$(gh issue create --title 'Prompt check-up timeline' --label promptcheckup --body 'Weekly agent checks and gated proposals.')
          fi
          gh issue comment "$issue" --body-file checkup.md
      - name: Open a proposal for review
        if: ${{ hashFiles('checkup.md') != '' && hashFiles('proposal.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mapfile -d '' -t prompt_files < <(python -c 'import sys, tomllib; c = tomllib.load(open("promptcheckup.toml", "rb")); sys.stdout.buffer.write(b"\0".join(p.encode() for p in c["prompts"]["files"]) + b"\0")')
          if git diff --quiet -- "${prompt_files[@]}"; then
            exit 0
          fi
          proposal_branch="promptcheckup/${RUN_ID}-${RUN_ATTEMPT}"
          git switch -c "$proposal_branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${prompt_files[@]}"
          git commit -m 'Improve prompts from weekly check-up'
          git push --set-upstream origin "$proposal_branch"
          gh pr create --title 'Prompt improvement from weekly check-up' --body-file proposal.md --head "$proposal_branch"
