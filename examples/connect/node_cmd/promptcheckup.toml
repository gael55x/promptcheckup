[agent]
cmd = "node agent.mjs"
description = "Greets a person through JSON stdin/stdout"
example_input = { question = "Ada" }
timeout_s = 30

[prompts]
files = ["prompts/system.md"]

[cases]
paths = ["cases/*.jsonl"]

[scoring]
mode = "score"
score = "node_score:score"

[run]
samples = 2
min_pairs = 20
max_calls = 400
